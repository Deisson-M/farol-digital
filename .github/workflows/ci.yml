# Integração contínua do Farol Digital: a cada push ou pull request,
# verifica tipos, roda os testes e gera o build da API e do site.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://farol:123456@localhost:3306/farol_digital
      JWT_SECRET: segredo-somente-para-testes-com-mais-de-32-caracteres
      PAGAMENTOS_WEBHOOK_SEGREDO: segredo-de-webhook-somente-para-testes-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
